<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0b10">
<title>Lume</title>
<style>[hidden]{display:none!important}
:root{--bg:#07070b;--card:rgba(255,255,255,.08);--card2:rgba(255,255,255,.15);--line:rgba(255,255,255,.12);--text:#f5f5f7;--dim:#a0a0ad;--accent:#ff9f0a;--accent2:#ffb340;--ok:#30d158;--bad:#ff453a;--spring:cubic-bezier(.2,.9,.25,1.15);color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f2f2f7;--card:rgba(255,255,255,.7);--card2:rgba(255,255,255,.95);--line:rgba(0,0,0,.08);--text:#1c1c1e;--dim:#6c6c75;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 -apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{min-height:100vh;padding:calc(env(safe-area-inset-top) + 6px) 16px calc(104px + env(safe-area-inset-bottom));position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;width:90vmax;height:90vmax;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none;will-change:transform}
body::before{left:-35vmax;top:-45vmax;background:radial-gradient(circle,rgba(255,159,10,.55),transparent 65%);animation:drift 38s ease-in-out infinite alternate}
body::after{right:-45vmax;bottom:-50vmax;background:radial-gradient(circle,rgba(94,92,230,.5),transparent 65%);animation:drift 46s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(12vmax,8vmax) scale(1.15)}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
section{animation:rise .5s var(--spring) both}
h1{font-size:32px;margin:20px 0 4px;letter-spacing:-.025em;font-weight:700}
p.sub{color:var(--dim);margin:0 0 18px}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border-radius:18px;padding:14px 16px;min-height:48px;cursor:pointer;touch-action:manipulation;transition:transform .35s var(--spring),background .25s}
button:active{transform:scale(.94);background:var(--card2);transition-duration:.08s}
input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;width:100%;min-height:48px;backdrop-filter:blur(22px)}
input:focus{outline:2px solid var(--accent)}
.pair{max-width:380px;margin:9vh auto 0;text-align:center}
.pair::before{content:"";display:block;width:92px;height:92px;margin:0 auto 22px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#ffd27a,#ff9f0a 45%,#c2500a);box-shadow:0 0 70px rgba(255,159,10,.55);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.07);box-shadow:0 0 95px rgba(255,159,10,.7)}}
.pair input{font-size:34px;letter-spacing:.35em;text-align:center}
.pair button{margin-top:14px;width:100%;background:var(--accent);color:#1a1000;font-weight:650;border:0}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:2px;padding:6px;border-radius:30px;background:rgba(30,30,36,.55);backdrop-filter:blur(28px) saturate(1.6);-webkit-backdrop-filter:blur(28px) saturate(1.6);border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.35)}
@media (prefers-color-scheme:light){nav{background:rgba(255,255,255,.7)}}
nav button{flex:1;background:none;border:0;font-size:11px;color:var(--dim);padding:8px 2px;min-height:52px;border-radius:24px;backdrop-filter:none}
nav button.on{color:var(--text);background:var(--card2)}
nav i,.rb i{display:block;width:24px;height:24px;margin:0 auto 3px}
svg.ic{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.surf{position:relative;width:100%;height:min(46vh,340px);border-radius:34px;background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 18px 50px rgba(0,0,0,.35);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.surf .hint{position:absolute;inset:auto 0 18px 0;text-align:center;color:var(--dim);font-size:13px;letter-spacing:.02em;pointer-events:none;transition:opacity .6s}
.surf.used .hint{opacity:.0}
.glow{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:radial-gradient(circle,rgba(255,179,64,.65),transparent 68%);opacity:0;transform:scale(.6);transition:opacity .35s,transform .45s var(--spring);pointer-events:none}
.glow.on{opacity:1;transform:scale(1)}
.surf .edge{position:absolute;color:var(--dim);opacity:.0;font-size:22px;transition:opacity .15s,transform .3s var(--spring);pointer-events:none}
.surf .edge.on{opacity:.95;transform:scale(1.35);color:var(--accent2)}
.edge.u{top:12px;left:50%;margin-left:-8px}.edge.d{bottom:12px;left:50%;margin-left:-8px}.edge.l{left:16px;top:50%;margin-top:-14px}.edge.r{right:16px;top:50%;margin-top:-14px}
.pad{width:min(72vw,280px);height:min(72vw,280px);margin:6px auto 18px;border-radius:50%;background:var(--card);border:1px solid var(--line);position:relative}
.pad button{position:absolute;background:none;border:0;font-size:26px;width:33%;height:33%;padding:0;border-radius:50%}
.pad .u{top:2%;left:33.5%}.pad .d{bottom:2%;left:33.5%}.pad .l{left:2%;top:33.5%}.pad .r{right:2%;top:33.5%}
.pad .o{left:33.5%;top:33.5%;background:var(--accent);color:#1a1000;font-weight:700;font-size:18px;box-shadow:0 4px 26px rgba(255,159,10,.5)}
.ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 12px}
.rb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;padding:12px 4px;min-height:74px;border-radius:24px}
.rb i{margin-bottom:2px}
.vol{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.vol button{width:64px;height:56px;padding:0;border-radius:28px;display:grid;place-items:center}.vol button i{display:block;width:22px;height:22px}
.vol .vbar{flex:1;height:8px;border-radius:4px;background:var(--card2)}
.favs{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity}.favs button{flex:0 0 auto;width:72px;height:72px;padding:0;border-radius:20px;scroll-snap-align:start;overflow:hidden}.favs img{width:100%;height:100%;object-fit:cover}
.favs .empty{color:var(--dim);font-size:13px;padding:6px 2px}
.row{display:flex;gap:10px;margin:0 0 10px}.row>button{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.app{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;font-size:12px;text-align:center;word-break:break-word}
.app img{width:56px;height:56px;border-radius:14px;background:var(--card2)}
.app u{position:absolute;top:4px;right:4px;width:28px;height:28px;color:var(--dim);text-decoration:none;display:grid;place-items:center}.app u.on{color:var(--accent2)}.app u svg{width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chips button{padding:10px 16px;min-height:44px;border-radius:22px}.chips button.on{background:var(--accent);color:#1a1000;border-color:transparent}
.list button{display:block;width:100%;text-align:left;margin-bottom:8px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:22px 0 10px;font-weight:600}
#toast{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));padding:12px 16px;border-radius:20px;background:rgba(44,44,52,.85);backdrop-filter:blur(20px);color:#fff;opacity:0;transform:translateY(10px) scale(.97);transition:.35s var(--spring);pointer-events:none;text-align:center}
#toast.show{opacity:1;transform:none}#toast.bad{background:rgba(90,31,27,.9)}
#offline{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translateX(-50%);z-index:5;display:flex;gap:10px;align-items:center;padding:10px 18px;border-radius:24px;background:rgba(60,40,10,.92);color:#ffd27a;font-size:14px;backdrop-filter:blur(20px);white-space:nowrap}
#offline b{width:10px;height:10px;border-radius:50%;background:#ff9f0a;animation:breathe 1.4s ease-in-out infinite}
#a11y{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:0 0 14px;font-size:14px}#a11y button{margin-top:10px;width:100%;background:var(--accent);color:#1a1000;font-weight:650;border:0}
#ovl{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;font-size:14px;color:var(--text)}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="pair" class="pair hide">
  <h1 data-t="pairTitle">Collega la TV</h1>
  <p class="sub" data-t="pairSub">Scrivi il codice di 6 cifre che vedi sulla TV.</p>
  <input id="pin" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000">
  <button id="pairBtn" data-t="pairBtn">Collega</button>
</div>

<main id="app" class="hide">
  <section id="t-remote">
    <h1 id="devname">Lume</h1><p class="sub" id="where"></p><p id="ovl" class="hide" style="margin:0 0 14px"></p><div class="chips hide" id="profs"></div><div id="a11y" class="hide"><span id="a11yTxt"></span><button id="a11yBtn"></button></div>
    <div id="surf" class="surf" role="application"><i class="edge u" data-ico="up"></i><i class="edge d" data-ico="down"></i><i class="edge l" data-ico="left"></i><i class="edge r" data-ico="right"></i><span class="glow" id="glow"></span><div class="hint" data-t="surfHint">Scorri per muoverti, tocca per scegliere</div></div>
    <div class="pad hide" id="dpad">
      <button class="u" data-key="up" aria-label="su">▲</button><button class="d" data-key="down" aria-label="giù">▼</button>
      <button class="l" data-key="left" aria-label="sinistra">◀</button><button class="r" data-key="right" aria-label="destra">▶</button>
      <button class="o" data-key="ok">OK</button>
    </div>
    <div class="ctl">
      <button class="rb" data-key="back"><i data-ico="back"></i><span data-t="back">Indietro</span></button>
      <button class="rb" id="homeBtn"><i data-ico="tv"></i><span data-t="home">Home</span></button>
      <button class="rb" data-key="menu"><i data-ico="menu"></i><span data-t="menu">Menu</span></button>
      <button class="rb hide" id="assistBtn"><i data-ico="mic"></i><span id="assistTxt"></span></button>
      <button class="rb" data-media="play"><i data-ico="play"></i><span data-t="mPlay">Play / Pausa</span></button>
      <button class="rb" data-media="mute"><i data-ico="mute"></i><span data-t="vMute">Muto</span></button>
    </div>
    <div class="vol"><button data-media="vol_down" aria-label="volume -"><i data-ico="minus"></i></button><div class="vbar"></div><button data-media="vol_up" aria-label="volume +"><i data-ico="plus"></i></button></div>
    <h2 data-t="scenes">Scene</h2><div class="chips" id="scenes"></div>
    <h2 data-t="favs">Preferiti</h2><div class="favs" id="favs"></div>
    <div class="chips"><button id="modeBtn"></button></div>
  </section>
  <section id="t-apps" class="hide"><h1 data-t="apps">App</h1><p class="sub" data-t="appsSub">Tocca per aprirla sulla TV.</p>
    <input id="appq" placeholder="Cerca un'app" data-p="findApp"><div class="grid" id="grid" style="margin-top:12px"></div></section>
  <section id="t-search" class="hide"><h1 data-t="search">Cerca</h1><p class="sub" id="searchSub"></p>
    <div class="chips" id="engines" style="margin-bottom:12px"></div>
    <form id="sf"><input id="q" placeholder="App, film, serie…" data-p="searchPh" enterkeyhint="search"></form>
    <div class="row" style="margin-top:12px"><button id="sendQ" style="background:var(--accent);font-weight:600" data-t="searchBtn">Cerca sulla TV</button></div></section>
  <section id="t-look" class="hide"><h1 data-t="look">Aspetto</h1>
    <h2 data-t="bg">Sfondo</h2><div class="chips" id="walls"></div>
    <h2 data-t="homeLook">Home</h2><div class="chips" id="looks"></div></section>
  <section id="t-clean" class="hide"><h1 data-t="cleanT">Pulisci la TV</h1><p class="sub" id="cleanSub"></p>
    <div class="list" id="cleanSteps"></div>
    <div id="keepBox" class="hide"><h2 data-t="keepH">Cosa vuoi tenere</h2><div class="chips" id="keeps"></div></div>
    <div class="list" style="margin-top:12px"><button id="cleanBtn" style="background:var(--accent);font-weight:600"></button><button id="cleanUndo" data-t="cleanUndo">Annulla la pulizia</button></div>
    <p class="sub" id="cleanLinked" style="margin-top:12px"></p></section>
  <section id="t-more" class="hide"><h1 data-t="more">Altro</h1><h2 data-t="open">Apri sulla TV</h2>
    <div class="list" id="shortcuts"></div>
    <h2 data-t="power">Alimentazione</h2><div class="list"><button id="sleepBtn" data-t="sleep">Spegni lo schermo</button></div>
    <h2 data-t="myTvs">Le mie TV</h2><div class="list" id="tvlist"></div>
    <div class="row"><input id="newTv" inputmode="url" autocapitalize="off" autocomplete="off" data-p="newTvPh"><button id="addTv" data-t="addTv">Aggiungi</button></div>
    <p class="sub" data-t="tvHelp" style="font-size:13px"></p>
    <h2 data-t="phone">Questo telefono</h2><div class="list"><button id="forget" data-t="forget">Scollega questo telefono</button></div></section>
</main>

<nav id="nav" class="hide">
  <button data-tab="remote" class="on"><i data-ico="remote"></i><span data-t="tRemote">Telecomando</span></button>
  <button data-tab="apps"><i data-ico="apps"></i><span data-t="tApps">App</span></button>
  <button data-tab="search"><i data-ico="search"></i><span data-t="tSearch">Cerca</span></button>
  <button data-tab="look"><i data-ico="look"></i><span data-t="tLook">Aspetto</span></button>
  <button data-tab="clean"><i data-ico="clean"></i><span data-t="tClean">Pulisci</span></button>
  <button data-tab="more"><i data-ico="more"></i><span data-t="tMore">Altro</span></button>
</nav>
<div id="offline" class="hide"><b></b><span id="offTxt"></span></div>
<div id="toast"></div>

  const w=$("#walls");w.textContent="";state.wallpapers.forEach(x=>chip(w,x.name,x.current,async()=>{if(await act({action:"wallpaper",key:x.key})){state.wallpapers.forEach(y=>y.current=y.key===x.key);drawLook()}}));
  const l=$("#looks");l.textContent="";[["scene",L.scene],["classic",L.classic]].forEach(([k,n])=>chip(l,n,state.look===k,async()=>{if(await act({action:"look",value:k})){state.look=k;drawLook()}}));
}
let keepSet=null,cleanTimer=null;
async function cleanPoll(){
  const r=await api("/api/remote/act",{method:"POST",body:JSON.stringify({action:"opt_state"})});if(!r)return;const j=(await r.json()).opt;if(!j)return;
  const st=j.status,steps=$("#cleanSteps");steps.textContent="";
  [[L.cs_dev,j.dev],[L.cs_adb,j.adb],[L.cs_ok,["ready","tidy","cleaning","done","stopped"].includes(st)]].forEach(([n,on])=>{const b=document.createElement("button");b.textContent=(on?"✓ ":"")+n;b.disabled=true;if(on)b.className="on";steps.append(b)});
  const f=(k,n)=>(L[k]||k).replace("{n}",n);
  $("#cleanSub").textContent=!j.dev?L.c_dev:!j.adb?L.c_adb:st==="waiting_ok"?L.c_waiting:st==="debug_off"?L.c_off:st==="ready"?f("c_ready",j.count):st==="tidy"?L.c_tidy:st==="cleaning"?L.c_cleaning:st==="done"?f("c_done",j.done):st==="stopped"?L.c_stopped:st==="failed"?L.c_failed:L.c_idle;
  const box=$("#keepBox"),k=$("#keeps");box.classList.toggle("hide",st!=="ready"||!j.groups.length);
  if(st==="ready"){if(!keepSet)keepSet=new Set(j.groups.filter(g=>g.keep).map(g=>g.id));k.textContent="";j.groups.forEach(g=>chip(k,(L["k_"+g.id]||g.id)+" ("+g.count+")",keepSet.has(g.id),()=>{keepSet.has(g.id)?keepSet.delete(g.id):keepSet.add(g.id);cleanPoll()}))}
  const b=$("#cleanBtn");b.hidden=false;b.disabled=st==="cleaning"||st==="waiting_ok"||(!j.dev||!j.adb);
  b.textContent=st==="ready"?L.c_clean:L.c_check;b.onclick=()=>act({action:st==="ready"?"opt_clean":"opt_check",keep:[...(keepSet||[])]});
  $("#cleanUndo").hidden=!j.saved;$("#cleanUndo").onclick=()=>act({action:"opt_undo"});
  $("#cleanLinked").textContent=st==="done"?(j.linked||[]).map(x=>"✓ "+({screensaver:L.l_screensaver,"home-button":L.l_home,airplay:L.l_airplay,"ads-off":L.l_ads,"phone-opens":L.l_phone,"cast-opens":L.l_cast}[x]||x)).join("   "):"";
}
function drawMore(){
  const s=$("#shortcuts");s.textContent="";
  [["cc","cc"],["recents","recents"],["weather","weather"],["markets","markets"],["news","news"],["health","health"],["settings","settings"],["airplay","airplay"]].forEach(([k,t])=>{
    const b=document.createElement("button");b.textContent=L[t];b.onclick=async()=>{if(await act({action:"open",screen:k}))toast(L.sent)};s.append(b)});
}
$$("[data-key]").forEach(b=>{
  const k=b.dataset.key;let rep;
  const fire=async()=>{if(await act({action:"key",key:k})===false)stop()};
  const stop=()=>{clearInterval(rep);rep=null};
  b.addEventListener("pointerdown",e=>{e.preventDefault();fire();if(["up","down","left","right"].includes(k))rep=setTimeout(()=>{rep=setInterval(fire,170)},380)});
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>{clearTimeout(rep);stop()}));
});
$("#homeBtn").onclick=()=>act({action:"home"});
$$("[data-media]").forEach(b=>b.onclick=()=>act({action:"media",key:b.dataset.media}));
function drawAssist(){const b=$("#assistBtn"),n=state&&state.assistant;b.classList.toggle("hide",!n);if(n){$("#assistTxt").textContent=n;b.onclick=()=>act({action:"assistant"})}}
let engine="tv",typeT;
function drawEngines(){const b=$("#engines");b.textContent="";[["tv",L.eTv],["youtube","YouTube"],["web",L.eWeb],["type",L.eType]].forEach(([k,n])=>chip(b,n,engine===k,()=>{engine=k;drawEngines()}));
  $("#searchSub").textContent=((engine==="type"&&state&&!state.canType)?L.needType:L["sub_"+engine])+" "+L.dictate;$("#sendQ").hidden=engine==="type"}
$("#q").addEventListener("input",()=>{if(engine!=="type")return;clearTimeout(typeT);typeT=setTimeout(()=>act({action:"type",text:$("#q").value}),220)});

$("#appq").oninput=drawApps;

const P={up:"M6 15l6-6 6 6",down:"M6 9l6 6 6-6",left:"M15 6l-6 6 6 6",right:"M9 6l6 6-6 6",back:"M15 5l-7 7 7 7",tv:"M4 11l8-7 8 7v8a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z",menu:"M5 8h14M5 12h14M5 16h14",mic:"M12 4a3 3 0 013 3v5a3 3 0 01-6 0V7a3 3 0 013-3zM6 11a6 6 0 0012 0M12 17v3",play:"M8 5l11 7-11 7z",mute:"M4 10v4h4l5 4V6L8 10zM17 9l4 6M21 9l-4 6",minus:"M6 12h12",plus:"M12 6v12M6 12h12",remote:"M9 3h6a2 2 0 012 2v14a2 2 0 01-2 2H9a2 2 0 01-2-2V5a2 2 0 012-2zM12 8a1.4 1.4 0 100 .01M10 15h4",apps:"M5 5h5v5H5zM14 5h5v5h-5zM5 14h5v5H5zM14 14h5v5h-5z",search:"M11 4a7 7 0 100 14 7 7 0 000-14zM20 20l-4-4",look:"M12 3a9 9 0 100 18V3z",clean:"M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM18 16l.8 2.2L21 19l-2.2.8L18 22l-.8-2.2L15 19l2.2-.8z",more:"M6 12h.01M12 12h.01M18 12h.01",star:"M12 4l2.4 5 5.4.7-4 3.8 1 5.4-4.8-2.6-4.8 2.6 1-5.4-4-3.8 5.4-.7z"};
const ico=n=>'<svg class="ic" viewBox="0 0 24 24"><path d="'+P[n]+'"/></svg>';
$$("[data-ico]").forEach(e=>{e.innerHTML=ico(e.dataset.ico)});
const buzz=n=>navigator.vibrate&&navigator.vibrate(n);
// The swipe surface: slide to move (a step for every 34 px), tap to choose, hold for Menu: the Apple TV Remote way.
const surf=$("#surf"),glow=$("#glow");let sx=null,ax=0,ay=0,moved=false,t0=0,edgeT;
function lightEdge(k){const e=surf.querySelector(".edge."+k[0]);if(!e)return;e.classList.add("on");clearTimeout(edgeT);edgeT=setTimeout(()=>surf.querySelectorAll(".edge").forEach(x=>x.classList.remove("on")),160)}
function place(e){const r=surf.getBoundingClientRect();glow.style.left=(e.clientX-r.left)+"px";glow.style.top=(e.clientY-r.top)+"px"}
surf.addEventListener("pointerdown",e=>{surf.setPointerCapture(e.pointerId);sx=ax=e.clientX;ay=e.clientY;moved=false;t0=Date.now();place(e);glow.classList.add("on");surf.classList.add("used")});
surf.addEventListener("pointermove",e=>{if(sx===null)return;place(e);const dx=e.clientX-ax,dy=e.clientY-ay,T=34;
  if(Math.abs(dx)>T||Math.abs(dy)>T){const k=Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up");act({action:"key",key:k});buzz(6);lightEdge(k);ax=e.clientX;ay=e.clientY;moved=true}});
const endSurf=e=>{if(sx===null)return;glow.classList.remove("on");if(!moved&&e.type==="pointerup"){const long=Date.now()-t0>650;act({action:"key",key:long?"menu":"ok"});buzz(long?[10,40,10]:14)}sx=null};
["pointerup","pointercancel"].forEach(v=>surf.addEventListener(v,endSurf));
// Preferiti: the apps the person keeps on the remote itself, kept on this phone.
let favs=[];try{favs=JSON.parse(localStorage.getItem("lume_favs")||"[]")}catch(e){}
const saveFavs=()=>{try{localStorage.setItem("lume_favs",JSON.stringify(favs))}catch(e){}};

function drawProfs(){const b=$("#profs");b.textContent="";const ps=state&&state.profiles||[];b.classList.toggle("hide",ps.length<2);
  ps.forEach(p=>chip(b,p.name,p.current,async()=>{if(await act({action:"profile",id:p.id})){state.profiles.forEach(x=>x.current=x.id===p.id);drawProfs();toast(p.name)}}))}
function drawA11y(){const c=$("#a11y");c.classList.toggle("hide",!state||state.keysEverywhere!==false);$("#a11yTxt").textContent=L.a11yTxt;const b=$("#a11yBtn");b.textContent=L.a11yBtn;b.onclick=()=>act({action:"a11y"})}

// One-tap scenes: a volume and an action together, so the sofa needs one thumb, not four screens.
const SCENES=[["cinema",async()=>{await act({action:"volume",pct:45});const f=state.apps.find(a=>favs.includes(a.pkg));if(f)await act({action:"launch",pkg:f.pkg})}],
  ["night",async()=>{await act({action:"volume",pct:15});await act({action:"sleep"})}],
  ["music",async()=>{await act({action:"volume",pct:50});await act({action:"open",screen:"airplay"})}]];
function drawScenes(){const b=$("#scenes");b.textContent="";SCENES.forEach(([k,fn])=>{const x=document.createElement("button");x.textContent=L["sc_"+k];x.title=L["sc_"+k+"_d"];x.onclick=async()=>{await fn();toast(L.sceneDone)};b.append(x)});
  const d=document.createElement("p");d.className="sub";d.style.cssText="width:100%;margin:6px 0 0;font-size:13px";d.textContent=SCENES.map(([k])=>L["sc_"+k]+": "+L["sc_"+k+"_d"]).join(" · ");b.append(d)}

// Several TVs, one phone: each TV serves this page from its own address, so the list travels in the link when you switch.
let tvs=[];try{tvs=JSON.parse(localStorage.getItem("lume_tvs")||"[]")}catch(e){}
function addTvEntry(t){if(!t||!t.url)return;const k=tvs.findIndex(x=>x.url===t.url);if(k<0)tvs.push({name:t.name||t.url,url:t.url});else if(t.name)tvs[k].name=t.name}
function saveTvs(){try{localStorage.setItem("lume_tvs",JSON.stringify(tvs.slice(0,12)))}catch(e){}}
(function(){const m=location.hash.match(/tvs=([^&]+)/);if(m){try{JSON.parse(atob(decodeURIComponent(m[1]))).forEach(addTvEntry)}catch(e){}history.replaceState(null,"",location.pathname)}})();
const goTv=u=>{location.href=u+"#tvs="+encodeURIComponent(btoa(JSON.stringify(tvs)))};
function drawTvs(){if(state)addTvEntry({name:state.name,url:location.origin+"/remote"});saveTvs();const l=$("#tvlist");l.textContent="";
  tvs.forEach(t=>{const here=t.url===location.origin+"/remote";const b=document.createElement("button");b.textContent=t.name+(here?"  ·  "+L.thisTv:"");if(here)b.className="on";else b.onclick=()=>goTv(t.url);l.append(b)})}
$("#addTv").onclick=()=>{let v=$("#newTv").value.trim().replace(/^https?:\/\//,"").replace(/\/.*$/,"");if(!/^[\w.-]+(:\d{2,5})?$/.test(v))return toast(L.badTv,1);if(!v.includes(":"))v+=":8080";addTvEntry({name:v,url:"http://"+v+"/remote"});saveTvs();goTv("http://"+v+"/remote")};
function drawFavs(){const f=$("#favs");f.textContent="";const list=state?state.apps.filter(a=>favs.includes(a.pkg)):[];
  if(!list.length){const d=document.createElement("div");d.className="empty";d.textContent=L.favsEmpty;f.append(d);return}
  list.forEach(a=>{const b=document.createElement("button");b.setAttribute("aria-label",a.label);const i=new Image();i.src="/api/remote/icon?pkg="+encodeURIComponent(a.pkg)+"&token="+encodeURIComponent(token);b.append(i);b.onclick=async()=>{if(await act({action:"launch",pkg:a.pkg}))toast(a.label)};f.append(b)})}
// Remote mode: swipe surface (default) or the classic button cross, remembered.
let mode="surf";try{mode=localStorage.getItem("lume_mode")||"surf"}catch(e){}
function drawMode(){$("#surf").classList.toggle("hide",mode!=="surf");$("#dpad").classList.toggle("hide",mode==="surf");$("#modeBtn").textContent=mode==="surf"?L.modePad:L.modeSurf}
$("#modeBtn").onclick=()=>{mode=mode==="surf"?"pad":"surf";try{localStorage.setItem("lume_mode",mode)}catch(e){}drawMode()};
const send=async()=>{const t=$("#q").value.trim();if(!t)return;const ok=engine==="type"?await act({action:"type",text:t}):engine==="tv"?await act({action:"search",text:t}):await act({action:"web",engine:engine,text:t});if(ok)toast(L.sent)};
$("#sendQ").onclick=send;$("#sf").onsubmit=e=>{e.preventDefault();send()};
$("#sleepBtn").onclick=()=>{if(confirm(L.ask))act({action:"sleep"})};
$("#forget").onclick=unpaired;
$$("[data-tab]").forEach(b=>b.onclick=()=>{clearInterval(cleanTimer);if(b.dataset.tab==="clean"){cleanPoll();cleanTimer=setInterval(cleanPoll,2000)};$$("[data-tab]").forEach(x=>x.classList.toggle("on",x===b));["remote","apps","search","look","clean","more"].forEach(t=>$("#t-"+t).classList.toggle("hide",t!==b.dataset.tab));if(b.dataset.tab==="search")$("#q").focus()});
if(token)start();else unpaired();
</script>
