name: Release
# Push a tag such as v0.9.4 and this builds Lume and attaches it, with its checksum, to a GitHub release.
# For public distribution add two repository secrets: LUME_KEYSTORE_B64 (the release key, base64) and LUME_KEYSTORE_PASS.
# Without them the build is signed with a throw-away debug key and is marked as a pre-release.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  lume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "build-tools;34.0.0" "platforms;android-34"
      - name: Restore release key
        if: ${{ secrets.LUME_KEYSTORE_B64 != '' }}
        run: echo "${{ secrets.LUME_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/lume.jks"
      - name: Build
        run: |
          cd lume
          export VERSION_NAME="${GITHUB_REF_NAME#v}" VERSION_CODE="${GITHUB_RUN_NUMBER}"
          if [ -f "$RUNNER_TEMP/lume.jks" ]; then export RELEASE_KEYSTORE="$RUNNER_TEMP/lume.jks" RELEASE_KEYSTORE_PASS="${{ secrets.LUME_KEYSTORE_PASS }}"; fi
          ./build.sh
          cp build/tvos-home.apk "../Lume-${GITHUB_REF_NAME}.apk"
          cd .. && sha256sum "Lume-${GITHUB_REF_NAME}.apk" > "Lume-${GITHUB_REF_NAME}.apk.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Lume-*.apk
            Lume-*.apk.sha256
          prerelease: ${{ secrets.LUME_KEYSTORE_B64 == '' }}
  tv-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd tv-doctor && zip -r "../TV-Doctor-${GITHUB_REF_NAME}.zip" . -x "backups/*" "__pycache__/*"
      - uses: softprops/action-gh-release@v2
        with:
          files: TV-Doctor-*.zip
