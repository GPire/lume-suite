name: CI
on: [push, pull_request]
jobs:
  tv-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          cd tv-doctor
          for t in test_issues test_discovery test_launchers test_suite test_scenarios test_pyadb; do python3 "$t.py"; done
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/privacy_scan.py
  lume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android build tools (the runner already has the SDK)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "build-tools;34.0.0" "platforms;android-34"
      - run: cd lume && ./build.sh
      - uses: actions/upload-artifact@v4
        with: { name: lume-apk, path: lume/build/tvos-home.apk }
