name: Build the TV Doctor app
# Builds the double-click app for Mac (Apple chip and Intel), Windows and Linux from the public source, and attaches
# each file with its SHA-256 to the release. Run it by hand: Actions > Build the TV Doctor app > Run workflow.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the files to"
        default: "v0.1.0"
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, name: TV-Doctor-mac-apple-chip }
          - { os: macos-13, name: TV-Doctor-mac-intel }
          - { os: windows-latest, name: TV-Doctor-windows }
          - { os: ubuntu-latest, name: TV-Doctor-linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install pyinstaller
      - name: Fetch the package list the app ships with
        working-directory: tv-doctor
        run: python -c "import tvdoctor as T; T.load_uad()"
      - name: Check the tests first
        working-directory: tv-doctor
        shell: bash
        run: for t in test_*.py; do python "$t" > /dev/null || exit 1; done
      - run: python tv-doctor/build_app.py ${{ matrix.name }}
      - name: Package so the executable bit survives a browser download
        shell: bash
        run: |
          cd tv-doctor/dist-app
          case "${{ matrix.os }}" in
            windows-latest) mv "${{ matrix.name }}.exe" "TV-Doctor-windows.exe"; out="TV-Doctor-windows.exe" ;;
            ubuntu-latest) mkdir pkg && cp "${{ matrix.name }}" "pkg/TV Doctor" && chmod +x "pkg/TV Doctor" && tar -C pkg -czf "${{ matrix.name }}.tar.gz" "TV Doctor"; out="${{ matrix.name }}.tar.gz" ;;
            *) mkdir pkg && cp "${{ matrix.name }}" "pkg/TV Doctor" && chmod +x "pkg/TV Doctor" && (cd pkg && zip -X -q "../${{ matrix.name }}.zip" "TV Doctor"); out="${{ matrix.name }}.zip" ;;
          esac
          if command -v shasum >/dev/null; then shasum -a 256 "$out" > "$out.sha256"; else sha256sum "$out" > "$out.sha256"; fi
          echo "OUT=$out" >> "$GITHUB_ENV"
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd tv-doctor/dist-app
          gh release upload "${{ inputs.tag }}" "$OUT" "$OUT.sha256" --clobber --repo "${{ github.repository }}"
