<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Lume: a calmer TV">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0b10"/><stop offset="1" stop-color="#241a3e"/></linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.55" r="0.55"><stop offset="0" stop-color="#ff9f0a" stop-opacity="0.38"/><stop offset="1" stop-color="#ff9f0a" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb" cx="0.38" cy="0.32" r="0.8"><stop offset="0" stop-color="#ffd27a"/><stop offset="0.45" stop-color="#ff9f0a"/><stop offset="1" stop-color="#c2500a"/></radialGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3f9e"/><stop offset="1" stop-color="#1b1d52"/></linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d63a3a"/><stop offset="1" stop-color="#6e1a1a"/></linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8b44a"/><stop offset="1" stop-color="#7a5a1a"/></linearGradient>
    <linearGradient id="card4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e90ff"/><stop offset="1" stop-color="#0a4aa8"/></linearGradient>
    <linearGradient id="card5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4a52"/><stop offset="1" stop-color="#1c1c20"/></linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <!-- the orb -->
  <circle cx="190" cy="205" r="92" fill="url(#orb)"/>
  <circle cx="190" cy="205" r="92" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
  <circle cx="190" cy="205" r="130" fill="none" stroke="#ff9f0a" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="190" cy="205" r="170" fill="none" stroke="#ff9f0a" stroke-opacity="0.09" stroke-width="2"/>
  <!-- words -->
  <text x="340" y="228" font-family="-apple-system,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="132" font-weight="650" fill="#ffffff" letter-spacing="-3">Lume</text>
  <text x="344" y="290" font-family="-apple-system,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="400" fill="#ffffff" fill-opacity="0.82">A calmer TV. Una TV più serena.</text>
  <g font-family="-apple-system,'SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif" font-size="26" fill="#ffffff">
    <rect x="344" y="326" width="196" height="50" rx="25" fill="#ffffff" fill-opacity="0.12"/><text x="442" y="360" text-anchor="middle">TV Doctor</text>
    <rect x="556" y="326" width="132" height="50" rx="25" fill="#ffffff" fill-opacity="0.12"/><text x="622" y="360" text-anchor="middle">Lume</text>
    <rect x="704" y="326" width="172" height="50" rx="25" fill="#ffffff" fill-opacity="0.12"/><text x="790" y="360" text-anchor="middle">Lume Cast</text>
  </g>
  <!-- a dock of cards, like the home screen -->
  <rect x="80" y="440" width="1120" height="160" rx="36" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
  <rect x="116" y="468" width="190" height="104" rx="18" fill="url(#card1)"/>
  <rect x="330" y="468" width="190" height="104" rx="18" fill="url(#card2)"/>
  <rect x="544" y="468" width="190" height="104" rx="18" fill="url(#card3)"/>
  <rect x="758" y="468" width="190" height="104" rx="18" fill="url(#card4)"/>
  <rect x="972" y="468" width="190" height="104" rx="18" fill="url(#card5)"/>
  <path d="M390 500 l50 20 l-50 20z" fill="#fff"/>
  <path d="M818 498 l52 22 l-52 22z" fill="#fff" fill-opacity="0.95"/>
  <circle cx="1067" cy="520" r="20" fill="none" stroke="#fff" stroke-opacity="0.8" stroke-width="5"/>
  <circle cx="211" cy="520" r="16" fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="5"/>
  <path d="M175 546 h72" stroke="#fff" stroke-opacity="0.85" stroke-width="5" stroke-linecap="round"/>
  <!-- the clock -->
  <text x="1230" y="150" text-anchor="end" font-family="'Antonio','Arial Narrow',Impact,sans-serif" font-size="150" font-weight="300" fill="#ffffff" fill-opacity="0.9" letter-spacing="2">18:30</text>
</svg>
