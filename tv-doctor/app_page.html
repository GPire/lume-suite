<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Doctor</title>
<style>
:root{--bg:#0B0D12;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--t1:#fff;--t2:rgba(255,255,255,.78);--t3:rgba(255,255,255,.55);--blue:#0A84FF;--ok:#34C759;--warn:#FFB020}
@media (prefers-color-scheme:light){:root{--bg:#F2F3F7;--glass:rgba(255,255,255,.8);--line:rgba(0,0,0,.1);--t1:#111114;--t2:rgba(0,0,0,.74);--t3:rgba(0,0,0,.5)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 15% 0,rgba(10,132,255,.22),transparent 70%),radial-gradient(700px 500px at 100% 100%,rgba(232,176,74,.16),transparent 70%),var(--bg);color:var(--t1);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center;padding:32px 16px}
main{width:100%;max-width:640px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.brand{font-weight:650;font-size:19px;letter-spacing:.01em}
select{background:var(--glass);color:var(--t1);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:inherit;font-size:15px}
.dots{display:flex;gap:8px;margin-bottom:20px}.dots i{height:5px;flex:1;border-radius:9px;background:var(--line);transition:background .4s}.dots i.on{background:var(--blue)}
.card{background:var(--glass);border:1px solid var(--line);border-radius:28px;padding:32px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}*{transition:none!important}}
h1{font-size:32px;line-height:1.15;margin:0 0 10px;font-weight:700}
p{margin:0 0 16px;color:var(--t2)} .small{font-size:15px;color:var(--t3)}
button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:15px 30px;cursor:pointer;background:var(--blue);color:#fff;transition:transform .16s,box-shadow .16s,background .2s}
button:hover,button:focus-visible{transform:scale(1.04);box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--blue);outline:0}
button.ghost{background:var(--glass);color:var(--t1);border:1px solid var(--line)}
button:disabled{opacity:.5;transform:none;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px;align-items:center}
.tv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border:1px solid var(--line);border-radius:18px;margin-bottom:10px;cursor:pointer;background:transparent;width:100%;text-align:left;color:var(--t1);font-weight:500}
.big{font-size:56px;font-weight:700;line-height:1;margin:6px 0}.big small{font-size:20px;font-weight:500;color:var(--t2)}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--blue);animation:r 1s linear infinite;margin:10px 0 18px}@keyframes r{to{transform:rotate(360deg)}}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:14px;color:var(--t2);margin:0 6px 6px 0}
.note{border-left:3px solid var(--warn);padding:2px 0 2px 14px;margin:10px 0;color:var(--t2);font-size:15px}
details{margin-top:14px;color:var(--t2)} summary{cursor:pointer;color:var(--t3)} li{margin:6px 0;font-size:15px}
input{background:var(--glass);border:1px solid var(--line);color:var(--t1);border-radius:14px;padding:13px 16px;font:inherit;width:180px}
.ok{color:var(--ok)}.step{display:flex;gap:18px;align-items:flex-start;margin:18px 0}.num{flex:none;width:52px;height:52px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#fff}.stxt{font-size:22px;line-height:1.35;font-weight:600}.labels{display:flex;justify-content:space-between;font-size:13px;color:var(--t3);margin:-12px 2px 18px;letter-spacing:.04em;text-transform:uppercase}.labels b{color:var(--t1);font-weight:600}.check{width:72px;height:72px;margin:4px 0 14px}.check circle{fill:none;stroke:var(--ok);stroke-width:3;stroke-dasharray:190;stroke-dashoffset:190;animation:dr .6s .1s ease forwards}.check path{fill:none;stroke:var(--ok);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:dr .4s .6s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}.cmp{display:flex;gap:14px;align-items:baseline;margin:6px 0 14px}.cmp .big{font-size:40px}.arrow{color:var(--t3);font-size:28px}
</style>
</head>
<body>
<main>
<header><div class="brand">TV Doctor</div>
<select id="lang" aria-label="Language"><option value="it">Italiano</option><option value="en">English</option><option value="es">Español</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="pt">Português</option><option value="zh">简体中文</option><option value="hi">हिन्दी</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="ar">العربية</option><option value="ru">Русский</option><option value="tr">Türkçe</option><option value="id">Bahasa Indonesia</option></select></header>
<div class="dots" id="dots"><i></i><i></i><i></i></div><div class="labels" id="labels"></div>
<div id="view"></div>
</main>

let lang=(localStorage.getItem("lang")||navigator.language||"it").slice(0,2);if(!L[lang])lang="en";
const $=s=>document.querySelector(s),V=$("#view");let tv=null,info=null,ip="";
const t=k=>L[lang][k]||L.en[k]||k;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api=(p,b)=>fetch(p,{method:"POST",headers:{"X-Token":TOKEN,"Content-Type":"application/json"},body:JSON.stringify(b||{})}).then(r=>r.json());
function dots(n){document.querySelectorAll("#dots i").forEach((e,i)=>e.classList.toggle("on",i<n));$("#labels").innerHTML=[t("st1"),t("st2"),t("st3")].map((x,i)=>i+1===n?"<b>"+x+"</b>":"<span>"+x+"</span>").join("");$("#view").setAttribute("aria-live","polite")}
function show(html,n){V.innerHTML='<div class="card">'+html+'</div>';dots(n)}
function loading(msg,n){show('<div class="spin"></div><h1>'+esc(msg)+'</h1>',n)}

function home(){setTimeout(toolsCheck,50);show('<h1>'+t("t1")+'</h1><p>'+t("s1")+'</p><div class="row"><button id="f">'+t("find")+'</button><button class="ghost" id="o">'+t("other")+'</button></div>',1);
 $("#f").onclick=find;$("#o").onclick=closedPick;$("#f").focus()}
async function find(){loading(t("finding"),1);const r=await api("/api/find");
 if(r.error||!r.tvs.length)return manual();
 found=r.tvs;if(found.length===1)return open1(found[0]);
 show('<h1>'+t("pick")+'</h1>'+found.map((x,i)=>'<button class="tv" data-i="'+i+'">'+esc(x.name)+'<span class="small">'+esc(x.kind)+'</span></button>').join(''),1);
 document.querySelectorAll(".tv").forEach(b=>b.onclick=()=>open1(found[+b.dataset.i]))}
let found=[];
function open1(x){if(x.kind==="adb")return inspectTv(x.serial);if(x.kind==="off")return showEnable(x.family,new Date().getFullYear()-3,x.name);showGuide(x.kind,x.year||new Date().getFullYear()-3,x.name,!!x.year)}
function manual(msg){show('<h1>'+t("none")+'</h1><p>'+t("noneS")+'</p><div class="row"><input id="ip" placeholder="192.168.1.20" inputmode="decimal" value="'+esc(ip)+'"><button id="c">'+t("go")+'</button><button class="ghost" id="n">'+t("nf")+'</button><button class="ghost" id="b">'+t("back")+'</button></div>',1);
 $("#n").onclick=wizard;$("#c").onclick=async()=>{ip=$("#ip").value;const r=await api("/api/connect",{ip});if(r.error)return manual();open1(r)};$("#b").onclick=home}
async function inspectTv(serial){tv=serial;loading(t("checking"),2);info=await api("/api/inspect",{serial});
 if(info.error)return manual();
 const profTxt={essenziale:t('pe'),equilibrato:t('pb'),pieno:t('pp')}[info.profile]||'';const notes=(info.notes||[]).concat(info.wireless?[info.wireless]:[]);
 const body=info.count?'<div class="big">'+info.count+' <small>'+t("clean")+'</small></div>'+(info.mb?'<p class="small">~'+info.mb+' '+t("mem")+'</p>':'')+'<p>'+t("safe")+'</p><p class="small">'+profTxt+'</p>'
  :'<p class="ok"><b>'+t("nothing")+'</b></p>';
 const det=info.count?'<details><summary>'+t("details")+'</summary><ul>'+info.items.map(i=>'<li><b>'+esc(i.pkg)+'</b> - '+esc(i.why)+'</li>').join('')+'</ul></details>':'';
 show('<span class="pill">'+esc(info.maker)+' '+esc(info.model)+'</span><span class="pill">Android '+esc(info.android)+'</span><span class="pill">'+info.ram+' MB</span><h1>'+t("found")+'</h1>'+body+det+
  (info.reactivated?'<div class="note" style="margin-top:14px">'+esc(t("drift").replace("{n}",info.reactivated))+'</div>':'')+
  (notes.length?'<h3 style="margin:18px 0 4px;font-size:16px">'+t("hint")+'</h3>'+notes.map(n=>'<div class="note">'+esc(n)+'</div>').join(''):'')+
  (info.suite?'<label class="note" style="display:flex;gap:10px;align-items:center;margin-top:14px"><input type="checkbox" id="inst" checked style="width:22px;height:22px"> '+t("suiteI")+'</label>':'')+
  '<label class="note" style="display:flex;gap:10px;align-items:center;margin-top:10px"><input type="checkbox" id="dns" style="width:22px;height:22px"> '+t("dnsI")+'</label>'+
  (info.replaceHome&&info.suite?'<label class="note" style="display:flex;gap:10px;align-items:center;margin-top:10px"><input type="checkbox" id="rh" style="width:22px;height:22px"> '+t("homeI")+'</label>':'')+
  '<div class="row">'+(info.count||info.suite?'<button id="a">'+t("apply")+'</button>':'')+'<button class="ghost" id="u">'+t("undo")+'</button></div>',2);
 if($("#a"))$("#a").onclick=doApply;$("#u").onclick=doUndo}
async function doApply(){const inst=$("#inst")?$("#inst").checked:false;loading(t("working"),3);const r=await api("/api/apply",{serial:tv,install:inst,replaceHome:$("#rh")?$("#rh").checked:false,dns:$("#dns")?$("#dns").checked:false});
 const chk='<svg class="check" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="30"/><path d="M23 37l9 9 18-20"/></svg>';
 const mem=r.before&&r.after?'<div class="cmp"><span class="small">'+t("free")+'</span><div class="big">'+r.before+'</div><span class="arrow">&rarr;</span><div class="big ok">'+r.after+' <small>MB</small></div></div>':'';
 const head=r.rolledBack?'<h1>'+t("done")+'</h1><div class="note">'+t("rb")+'</div>':chk+'<h1 class="ok">'+t("done")+'</h1><p><b>'+(r.done||0)+'</b> '+t("doneS")+'</p>';
 const su=r.suite?'<h3 style="margin:16px 0 4px;font-size:16px">'+t("suiteD")+'</h3>'+r.suite.map(x=>'<div class="note">'+(x.ok?'&#10003; ':'&#10007; ')+esc(x.app)+(x.ok?'':' - '+t("suiteNo")+(x.why?' ('+esc(x.why)+')':''))+'</div>').join(''):'';
 const ho=r.home===true?'<div class="note">&#10003; '+t("homeOk")+'</div>':r.home===false?'<div class="note">'+t("homeNo")+'</div>':'';
 show(head+mem+su+ho+'<div class="row"><button class="ghost" id="u">'+t("undo")+'</button><button class="ghost" id="h">'+t("again")+'</button></div>',3);
 $("#u").onclick=doUndo;$("#h").onclick=home}
async function doUndo(){loading(t("working"),3);await api("/api/undo",{serial:tv});
 show('<h1 class="ok">'+t("undone")+'</h1><div class="row"><button id="h">'+t("again")+'</button></div>',3);$("#h").onclick=home}
function closedPick(){const y=new Date().getFullYear();show('<h1>'+t("gT")+'</h1><p>'+t("gS")+'</p><div class="row"><select id="os"><option value="roku">Roku TV</option><option value="vidaa">Hisense VIDAA</option><option value="tizen">'+t("s").Samsung+'</option><option value="webos">'+t("s").LG+'</option></select><select id="yr">'+Array.from({length:y-2014},(_,i)=>y-i).map(v=>'<option>'+v+'</option>').join('')+'</select></div><div class="row"><button id="g">'+t("go")+'</button><button class="ghost" id="b">'+t("back")+'</button></div>',1);
 $("#b").onclick=home;$("#g").onclick=()=>showGuide($("#os").value,+$("#yr").value)}
async function showGuide(os,year,label,guessed){const g=await api("/api/guide",{os,year,lang});
 show((label?'<span class="pill">'+esc(label)+'</span>'+(guessed?'<span class="pill">~'+year+'</span>':''):'')+'<h1>'+esc(g.name)+'</h1><p>'+esc(g.reach)+'</p><h3>'+t("sets")+'</h3><ul>'+g.settings.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul><h3>'+t("dns")+'</h3><ul>'+g.dns.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul><div class="note">'+esc(g.risks.join('; '))+'</div><div class="row"><button class="ghost" id="b">'+t("back")+'</button></div>',2);$("#b").onclick=home}

function wizard(){const y=new Date().getFullYear();const B=[["amazon","bAmazon"],["android","bAndroid"],["samsung","bSamsung"],["lg","bLG"],["roku","bRoku"],["vidaa","bVidaa"]];
 show('<h1>'+t("br")+'</h1><p class="small">'+t("yr2")+'</p><select id="yr">'+Array.from({length:y-2014},(_,i)=>y-i).map(v=>'<option'+(v===y-3?' selected':'')+'>'+v+'</option>').join('')+'</select><div style="height:14px"></div><div class="row" style="flex-direction:column;align-items:stretch">'+B.map(b=>'<button class="tv" data-b="'+b[0]+'">'+t(b[1])+'</button>').join('')+'</div><div class="row"><button class="ghost" id="b">'+t("back")+'</button></div>',1);
 document.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>showEnable(b.dataset.b,+$("#yr").value));$("#b").onclick=home}
async function showEnable(brand,year,label){const g=await api("/api/enable",{brand,year,lang});let i=0;
 const draw=()=>{const last=i===g.steps.length-1;
  show((label?'<span class="pill">'+esc(label)+'</span>':'')+'<span class="pill">~'+year+'</span><h1>'+esc(g.title)+'</h1>'+(i===0?'<p>'+esc(g.intro)+'</p>':'')+
   '<div class="step"><div class="num">'+(i+1)+'</div><div><div class="small">'+t("stp")+' '+(i+1)+' '+t("of")+' '+g.steps.length+'</div><div class="stxt">'+esc(g.steps[i])+'</div></div></div>'+
   (last&&g.notes.length?g.notes.map(n=>'<div class="note">'+esc(n)+'</div>').join(''):'')+
   '<div class="row"><button id="nx">'+t("next")+'</button><button class="ghost" id="pv">'+t("prev")+'</button></div>',1);
  $("#pv").onclick=()=>{if(i>0){i--;draw()}else wizard()};
  $("#nx").onclick=()=>{if(!last){i++;draw()}else if(g.can==="clean")waitTv();else showGuide(g.os||"tizen",year,label,false)}};draw()}
let waiting=false;
async function waitTv(){waiting=true;show('<div class="spin"></div><h1>'+t("wait")+'</h1><p>'+t("waitS")+'</p><div class="row"><button class="ghost" id="b">'+t("back")+'</button></div>',1);$("#b").onclick=()=>{waiting=false;home()};
 while(waiting){const r=await api("/api/find");const hit=(r.tvs||[]).find(x=>x.kind==="adb");if(hit){waiting=false;return inspectTv(hit.serial)}await new Promise(z=>setTimeout(z,4000))}}
async function toolsCheck(){const r=await api("/api/adbstatus");if(r.ready)return;
 const c=document.createElement("div");c.className="card";c.style.marginTop="14px";c.innerHTML='<h3 style="margin:0 0 6px">'+t("tools")+'</h3><p class="small">'+t("toolsS")+'</p><div class="row" style="margin-top:8px"><button id="ti">'+t("toolsGo")+'</button></div>';V.appendChild(c);
 $("#ti").onclick=async()=>{$("#ti").disabled=true;const x=await api("/api/install_adb");c.innerHTML='<p class="'+(x.ok?'ok':'')+'"><b>'+(x.ok?t("toolsOk"):esc(x.error||"error"))+'</b></p>'}}
$("#lang").value=lang;$("#lang").onchange=e=>{lang=e.target.value;try{localStorage.setItem("lang",lang)}catch(_){}document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";home()};
document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";home();
if(location.hash==='#w')wizard();else if(location.hash.startsWith('#e:')){const q=location.hash.slice(3).split(',');showEnable(q[0],+q[1]||2023)}
